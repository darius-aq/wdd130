<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Document</title>
</head>

<body>
    <main>
        <h1>☑ Basic Html and CSS quiz</h1>
        <form>
            <div>
                <label for="q1"><span>1.</span> What does the acronym CSS stands for?</label>
                <input type="text" name="q1" id="q1">
            </div>
            <div>
                <label for="q2"><span>2.</span> How are the id and class attributes selected in
                    CSS?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
            <div>
                <label for="q3"><span>3.</span> Which of the following is a valid CSS
                    comment</label>
                <select name="q3" id="q3">
                    <option disabled selected>Choose one...</option>
                    <option value="A">A. //This is a CSS comment</option>
                    <option value="B">B. /* this is a CSS comment */</option>
                    <option value="C">C. # This is a CSS comment</option>
                </select>
            </div>
            <div>
                <label for="q4">
                    <p>
                        <span>4.</span>What is the bottom margin given this declaration?
                    </p>
                    <code class="exampleCode">margin: 10px 5px 15px;</code>
                </label>
                <input type="number" name="q4" id="q4">
            </div>
            <div>
                <button type="submit">Submit Quiz</button>
            </div>
        </form>
    </main>
</body>

</html>

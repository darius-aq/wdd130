<body>
    <header>
        <img src="images/wwr-logo.png" alt="White Water Rafting logo" class="logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>

                <li><a href="contact.html">Contact Us</a></li>
            </ul>

    <!-- =================================================================================== -->
    <main>
        <section class="contact-us">
            <h2>White Water Rafting Company</h2>
            <address>
                123 Main River Sreet<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </address>

        </section>

            <h2>Adventure Awaits You!</h2>
            <figure class="galery">
                <figure class="card"><img src="images/galery-01.webp" alt="family rafting">

                </figure>
                <figure class="card"><img src="images/galery-02.webp"
                      alt="group of friends going up a waterfall">
                    <figcaption>Futaleufú River</figcaption>

                <figure class="card"><img src="images/galery-03.webp"
                      alt="single person rafting with a camera in the helmet">
                    <figcaption>Grand Canyon </figcaption>
                </figure>
                <figure class="card"><img src="images/galery-04.webp"
                      alt="Family ending their rafting">
                    <figcaption>Sun Koshi River</figcaption>
                </figure>
                <figure class="card"><img src="images/galery-05.webp"
                      alt="Five woman in a rafting together">
                    <figcaption>Gauley River</figcaption>
                </figure>
